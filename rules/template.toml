# slophound rules: sentence templates (regex layer).
#
# A template rule matches a sentence shape rather than fixed words: negation
# followed by a reveal, clipped fragments in parallel, colon-reveal labels.
# The regex therefore spans variable content; keep every wildcard bounded
# (`[^.!?\n]{1,80}`) so a match never swallows a whole paragraph.
#
# Same fields as rules/phrase.toml. Templates never run inside headings.
# Rules run on the prose view: typographic quotes are already straight, so
# only `'` needs handling in patterns.

[[rule]]
id = "template.not-x-but-y"
severity = "bite"
pattern = "\\b(it|this|that|the \\w+|\\w+) (is|was|'s)(n't| not) (just |only |simply |merely |about )?[^.!?\\n;]{1,80}[.;,]\\s*(it|this|that)('s| is| was)( about)? \\b|\\bnot (just|only|merely|simply) (a |an |the |about )?[^.!?\\n,;]{1,60}[,;]?\\s*(but|it's|it is)( also| rather| about)? \\b|\\bit's not about [^.!?\\n]{1,60}[.,;]\\s*it's about\\b|\\bless [^.!?\\n,]{1,40}, more \\b|\\bforget [^.!?\\n.]{1,40}\\. this is\\b|\\bwhat matters (isn't|is not) [^.!?\\n,]{1,60}, it's\\b|\\bit's less about [^.!?\\n,]{1,50}(,| and| than) more about\\b|\\b[^.!?\\n]{1,40} (isn't|is not|was never) the point\\. \\b"
# A conditional clause ("If it is not in the registry, it is not approved.")
# has the same shape but states a rule, so the sentence is skipped when it
# opens with a subordinator.
unless = "^(if|when|whenever|unless|until|once|as long as|provided|so long as|where|wherever|while|should|in case)\\b|\\b(the thing that mattered wasn'?t|what interests me isn'?t|there wasn'?t one|under the statute|skipped means the artifact is not produced)\\b"
message = "Negation-then-reveal (\"It's not X, it's Y\"). Delete the negated half and state the positive claim."
example = [
  "This isn't just a performance fix, it's a correctness fix.",
  "It's not about speed. It's about trust.",
  "The problem was not the cache. It was the lock.",
  "This is not only faster but also safer.",
  "Less ceremony, more shipping.",
  "The gap is not adoption. It is everything between one person's editor and the way we actually build and ship software.",
  "The gap is not adoption.\nIt is everything between one person's editor and the way we actually build and ship software.",
]
acceptable = [
  "This fixes a correctness bug and, as a side effect, a performance one.",
  "The lock caused the problem.",
  "It is not finished. We still need the migration script and a rollback plan.",
  "If it is not in the registry, it is not approved.",
  "When the flag is not set, the job is skipped.",
  "Unless the test is not flaky, it stays in the suite.",
  "The thing that mattered wasn't the fancy migration plan with the Gantt chart. It was one engineer writing a doc during a slow week.",
  "What interests me isn't which side is right. It's that both numbers are real and they point in opposite directions.",
  "There wasn't one. That's the thing about it.",
  "Under the statute, the agency not only reviews the filing but also issues a notice.",
  "Skipped means the artifact is not produced at all for this work type.",
]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.not-x-period-y"
severity = "bite"
pattern = "(^|(?<=[.!?] ))(not|no) [^.!?\\n]{1,40}\\. (the |it's |that's |just |only )?[a-z][^.!?\\n]{1,60}[.!?]|(?<=[.!?] )not (anymore|any longer|now|today|here)\\.[ \\t]*$"
unless = "^no license file yet\\."
message = "Clipped negation followed by the correction (\"Not X. Y.\"). Write the claim as one plain sentence."
example = ["Not anymore. The queue is durable now.", "No more retries. Just one durable write.", "Nothing exercised the failure mode. Not anymore."]
acceptable = ["No retries were needed during the test window, which surprised the team.", "No license file yet. Assume MIT, I'll add it properly when I'm not lazy."]
most_common_in = ["claude"]

[[rule]]
id = "template.stacked-anaphora"
severity = "bite"
pattern = "(^|(?<=[.!?] ))(no|not|every|it's|it is|they|we|you) [^.!?\\n]{1,40}\\. \\2 [^.!?\\n]{1,40}\\. \\2 \\b"
message = "Three or more clauses opening with the same word as a drumbeat. Merge them into one sentence with real connectives."
example = ["No retries. No queues. No surprises.", "It's fast. It's small. It's done."]
acceptable = ["The service has no retries, no queues, and therefore fewer surprises during incidents."]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.mic-drop"
severity = "bite"
pattern = "(^|(?<=[.!?] ))(full stop|period|let that sink in|read that again|that's it|that's the (whole )?(point|thing|job|story)|it matters|this works)\\.|\\. that's it\\. that's the \\w+\\."
message = "Mic-drop fragment for effect. Delete it; the previous sentence already made the point."
example = ["It's about trust. Full stop.", "Ship it. That's it. That's the job."]
acceptable = ["The sentence ends with a full stop, then a newline."]
most_common_in = ["claude"]

[[rule]]
id = "template.self-answered-question"
severity = "bite"
pattern = "(^|(?<=[.!?] ))(the (result|catch|reason|kicker|problem|best part|worst part|scary part|bottom line|upshot|cost|answer|fix|detail|part everyone misses))\\? [A-Z]"
message = "Question asked only to answer it in the next breath. Fold the answer into a statement."
example = ["The result? Two outages in a week.", "The catch? Every retry doubles the load.", "The worst part? Nobody saw it coming.", "The scary part? The token never expires.", "The detail? A second worker grades every result.", "The part everyone misses? Distribution decides adoption."]
acceptable = ["Two outages followed in a week.", "What is the result of the query when the table is empty?", "The detail is a second worker that grades every result."]
most_common_in = ["gpt", "claude"]

[[rule]]
id = "template.hollow-acknowledgment"
severity = "bite"
pattern = "\\b(names?|acknowledges?|raises?|surfaces?|notes?|flags?|highlights?) the (problem|question|issue|risk|tension|tradeoff) without (solving|answering|addressing|resolving|fixing)\\b"
message = "Naming a problem to sound rigorous while declining to act on it. Either act, or state that it is out of scope and why."
example = ["The design names the problem without solving it."]
acceptable = ["The design leaves retries out of scope because the queue already deduplicates."]
most_common_in = ["claude"]

[[rule]]
id = "template.historical-analogy-stack"
severity = "bite"
pattern = "\\b(apple|google|facebook|amazon|microsoft|netflix|uber|airbnb|stripe|tesla|kodak|nokia|blockbuster) didn'?t (build|invent|need|start with) [^.!?\\n]{1,40}\\. (apple|google|facebook|amazon|microsoft|netflix|uber|airbnb|stripe|tesla|kodak|nokia|blockbuster) didn'?t\\b"
message = "Company analogies stacked to borrow authority. Argue the point on its own facts."
example = ["Apple didn't build Uber. Facebook didn't build Spotify."]
acceptable = ["Stripe's API design shows that idempotency keys are practical at scale."]

[[rule]]
id = "template.fake-casual-quote"
severity = "bite"
pattern = "\\b(go|goes|went|say|says|said|think|thinks|thought|call|calls|called) \"(nope|yep|meh|huh|whatever|good enough|fine|cool|ugh|oops|wait, what)\\W?\""
message = "Casual word in scare quotes to perform relatability when nobody is quoted. Say it plainly or drop it."
example = ["Most engineers go \"nope\" at the first sight of the config."]
acceptable = ["Most engineers refuse to touch the config."]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.invented-concept-label"
severity = "bark"
pattern = "\\bthe [a-z]+ (paradox|trap|creep|divide|vacuum|inversion|gap|debt|tax|ceiling|cliff)\\b"
unless = "\\b(technical debt|tech debt|debt ceiling|the gender gap|the pay gap|the digital divide|the fiscal cliff)\\b"
message = "Coined label presented as established vocabulary. Explain the phenomenon in plain words instead of naming it."
example = ["We call this the supervision paradox.", "This is the acceleration trap."]
acceptable = ["The team pays down technical debt every Friday.", "Reviewers approve faster than they read, so review stops catching bugs."]
most_common_in = ["claude"]

[[rule]]
id = "template.compressed-compound"
severity = "bark"
pattern = "\\b[a-z]+-(shaped|aware|local|path|native|first|centric|adjacent|bound|scoped) (output|validation|path|boundary|ownership|approach|design|change|model|story|thinking|work|problem|solution|surface|layer)\\b"
unless = "\\b(cloud-native|mobile-first|api-first|offline-first|local-first|test-first)\\b|(?-i:\\b[A-Z][a-z]+-[A-Z][a-z]+ Approach\\b)"
message = "Improvised noun compound that needs the working session to decode. Spell out the relationship in a clause."
example = ["The reviewer wants review-shaped output.", "This is a workspace-local validation path."]
acceptable = ["The reviewer wants a summary they can read in a minute.", "We build cloud-native services.", "Artifact-Centric Approach"]
most_common_in = ["claude"]

[[rule]]
id = "template.false-range"
severity = "bark"
pattern = "\\b(ranging|spanning) (everything )?from [^.!?\\n,]{1,40} to \\b|\\beverything from [^.!?\\n,]{1,40} to \\b"
message = "\"From X to Y\" where X and Y share no scale. List the items or name the actual dimension."
example = ["The tool handles everything from onboarding to observability."]
acceptable = ["Response times ranged from 20 ms to 900 ms.", "The tool handles onboarding and observability."]
most_common_in = ["gpt", "gemini"]

[[rule]]
id = "template.agent-status-report"
severity = "bark"
pattern = "^[ \\t]*(what changed|tests|notes|next steps|summary|changes made|verification)[ \\t]*:[ \\t]*$"
message = "Status-report section headers over a small change. If one or two sentences say it all, use them."
example = ["**What changed:**\n\nRenamed a variable.\n\n**Tests:**\n\nNone."]
acceptable = ["Renamed `foo` to `bar`; no tests touched."]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.isnt-the-problem"
severity = "bite"
pattern = "\\b[^.!?\\n]{1,40} (isn't|is not|wasn't|was not|aren't|are not) the (problem|issue|bottleneck|point|hard part|question|answer|risk|goal)\\. [^.!?\\n]{1,40} (is|was|are|were)\\.|\\bthe (problem|issue|bottleneck|question|risk) (isn't|is not|wasn't|was not) [^.!?\\n]{1,40}\\. (it's|it is|it was) \\b"
message = "\"X isn't the problem. Y is.\" reveal. Name Y in one direct sentence and drop the decoy."
example = [
  "The cache isn't the problem. The lock is.",
  "The problem isn't the schema. It's the migration order.",
]
acceptable = [
  "The lock, not the cache, causes the stall.",
  "The migration order causes the failures; the schema is fine.",
]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.feels-like-actually"
severity = "bite"
pattern = "\\b(it |this |that )?(feels|looks|seems|sounds|reads) like [^.!?\\n]{1,60}\\. (it's|it is|this is|that's|in reality it's|but it's) (actually|really|in fact) \\b|\\b(feels|looks|seems|sounds) like [^.!?\\n,]{1,50}, but (it's|it is|in reality) (actually|really) \\b|\\bon the surface,? [^.!?\\n]{1,60}\\. (underneath|in reality|in practice|actually|below the surface),? \\b"
message = "Appearance-versus-reality reveal (\"It feels like X. It's actually Y.\"). State Y and, if X matters, explain why people assume it."
example = [
  "It feels like a caching bug. It's actually a clock skew problem.",
  "This looks like a refactor, but it's really a rewrite.",
]
acceptable = [
  "The failures come from clock skew between the two regions.",
  "The change replaces the module rather than restructuring it.",
]
most_common_in = ["claude"]

[[rule]]
id = "template.fragment-chain"
severity = "bite"
pattern = "(?<=[.!?] )(and|but|or|because|so|yet) [^.!?\\n]{1,40}\\. (and|but|or|because|so|yet) [^.!?\\n]{1,40}\\.|(?<=[.!?] )(and|but) (then|now|yet|still) [^.!?\\n]{1,30}\\.|(?<=[.!?] )(better|worse|faster|slower|cheaper|simpler|harder|easier|safer)\\.|(?<=[.!?] )(every|each) (single )?(time|one|day|deploy|request|commit)\\.|(?<=[.!?] )(always|never|nothing|everything|twice|once|no exceptions|no excuses|zero)\\."
message = "Conjunction-led fragment chain (\"X. And Y. And Z.\") or one-word verdict sentence. Join the fragments into one sentence with a verb."
example = [
  "The queue drains. And the cache warms. And nobody notices.",
  "The rewrite shipped. Faster.",
  "The health check ran. Every single time.",
]
acceptable = [
  "The queue drains and the cache warms before anyone notices.",
  "The rewrite shipped and cut latency by half.",
]
most_common_in = ["claude"]

[[rule]]
id = "template.no-x-no-y-just-z"
severity = "bite"
pattern = "\\bno [^.!?\\n,]{1,25}, no [^.!?\\n,]{1,25}, (just|only|simply) \\b|\\bno [^.!?\\n,.]{1,25}\\. no [^.!?\\n.]{1,25}\\. (just|only|simply) \\b|\\b(without|zero) [^.!?\\n,]{1,25}, (without|zero) [^.!?\\n,]{1,25}, (just|only) \\b|\\bmore than just (a|an|the) \\b|\\bbeyond (just )?[^.!?\\n,]{1,40}, (it|this|that) (also|is|has|offers|provides)\\b|\\bisn't just (a|an|the|about) \\b|\\bnot just (a|an|the|about) [^.!?\\n,]{1,40}[,.] (it's|it is|this is|but) \\b|\\b[^.!?\\n]{1,40}\\. not [^.!?\\n]{1,25}\\. (just|only|simply) \\b"
unless = "\\bhe isn'?t just a lawyer\\b"
message = "Elimination triplet (\"No X, no Y, just Z\") or \"more than just X\" escalation. Say what the thing is; the excluded alternatives add nothing."
example = [
  "No retries, no queues, just one durable write.",
  "This is more than just a cache.",
  "Beyond speed, it also fixes the ordering bug.",
  "Store the payload. Not the metadata. Just the content hash.",
]
acceptable = [
  "One durable write replaces the retry and queue layers.",
  "The cache also fixes the ordering bug because writes are now serialized.",
  "He isn't just a lawyer.",
  "Store the payload and its metadata with the content hash.",
]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.is-a-x-not-a-y"
severity = "bite"
pattern = "\\b(is|was|are|were|becomes?|remains?) (a|an) [a-z][a-z-]*( [a-z][a-z-]*)?, not (a|an) [a-z][a-z-]*( [a-z][a-z-]*)?[.,;]|\\b(a|an) [a-z][a-z-]*( [a-z][a-z-]*)?, not (a|an) [a-z][a-z-]*( [a-z][a-z-]*)?\\.|\\bfeature, not a bug\\b|\\bbug, not a feature\\b"
unless = "\\b(is|was) (a|an) (int|integer|string|float|list|dict|array|byte|boolean|bool|char|struct|class|enum|pointer|reference|copy|view|tuple|set|map)\\b|\\bdeferral is a decision, not an omission\\b"
message = "\"X is a N, not a M\" contrast where the reader never assumed M. State what it is, and mention the alternative only if someone actually proposed it."
example = [
  "The linter is a gate, not a suggestion.",
  "This is a build step, not an output.",
  "Determinism is a feature, not a bug.",
]
acceptable = [
  "The linter blocks the commit when it finds a violation.",
  "The value is a string, not a number, so the comparison fails.",
  "Deferral is a decision, not an omission.",
]
most_common_in = ["claude"]

[[rule]]
id = "template.parenthetical-hedge"
severity = "bite"
pattern = "\\((and, increasingly,|and )?(perhaps|arguably|increasingly|maybe|possibly|probably|crucially|importantly|more importantly|and more importantly|or, more precisely|or more precisely|to be fair|to be honest|admittedly|frankly|honestly|ironically|unsurprisingly|not coincidentally|spoiler|read: )[^)\\n]{0,60}\\)"
message = "Parenthetical aside carrying the actual judgement. Promote the aside to its own sentence or delete it."
example = [
  "The migration (and perhaps more importantly, the rollback) is untested.",
  "The queue is durable (arguably the only part that matters).",
]
acceptable = [
  "The migration is untested. So is the rollback, which matters more.",
  "The queue is durable (see `queue.md`).",
]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.false-concession"
severity = "bite"
pattern = "(^|(?<=[.!?] ))(while|although|though|even though) [^.!?\\n,]{1,60} (is|are|remains?|shows?|has|have|holds?) (promising|promise|impressive|impressive strides|potential|strides|merit|advantages|benefits|progress|appeal|value|momentum|traction|clear benefits|real strengths|its (strengths|merits|place|uses|appeal)|come a long way|made (great |significant |real )?(strides|progress)),? [^.!?\\n]{1,60} (remains?|is still|are still|still (faces|poses|presents|raises)|faces?|poses?|persists?|linger)\\b|\\bdespite (its|their|these|the) (many |clear |obvious |undeniable )?(strengths|advantages|benefits|promise|potential|progress|merits|success|successes|popularity|appeal),? [^.!?\\n]{1,60} (faces?|remains?|is not without|still)\\b"
message = "Formula concession (\"While X is promising, Y remains a challenge\"). Drop the balancing clause and state the concrete problem with its cause."
example = [
  "While the new scheduler is promising, latency remains a challenge.",
  "Although caching has made significant strides, cold starts still pose a problem.",
  "Despite its strengths, the framework faces adoption hurdles.",
]
acceptable = [
  "The new scheduler adds 40 ms of latency on every dispatch.",
  "Cold starts still take four seconds because the model loads on first request.",
]
most_common_in = ["gpt", "gemini"]

[[rule]]
id = "template.title-case-triple"
severity = "bark"
pattern = "\\b(Digital|Data|Cloud|Customer|Business|Enterprise|Strategic|Operational|Organizational|Organisational|Agile|Innovation|Modern|Intelligent|Smart|Seamless|Unified|Scalable|Sustainable|Holistic|End-to-End|Next-Generation|Value-Driven|Human-Centered|Human-Centred|Customer-Centric|Data-Driven|AI-Powered|AI-Driven|Future-Ready) [A-Z][a-z]+(-[A-Z][a-z]+)? (Journey|Transformation|Excellence|Enablement|Empowerment|Roadmap|Framework|Ecosystem|Paradigm|Strategy|Vision|Mindset|Culture|Initiative|Experience|Solutions?|Platform|Alignment|Synergy|Acceleration|Optimization|Optimisation|Innovation|Readiness)\\b"
message = "Capitalized buzzword triple presented as a proper noun. Lowercase it and say what the work actually is."
example = [
  "The team is on a Digital Transformation Journey.",
  "This unlocks Customer Experience Excellence across regions.",
]
acceptable = [
  "The team is moving the billing system off the mainframe.",
  "Support tickets dropped by a third after the redesign.",
]
most_common_in = ["gpt", "gemini"]

[[rule]]
id = "template.triad-that-actually"
severity = "bite"
pattern = "\\b[^.!?\\n,;:]{1,40}, [^.!?\\n,;:]{1,40},? (and|or) [^.!?\\n,;:]{1,40} (that|which|who) (actually|really|truly|genuinely) \\w+|\\b(that|which|who) (actually|really|truly|genuinely) (works?|matters?|ships?|deliver(s|ed)?|help(s|ed)?|scales?|lasts?|sticks?|stays?|holds?|gets? (used|read|done)|makes? (sense|a difference)|moves? the needle|solves?|fits?|cares?|means? (it|something))\\b"
message = "\"W, X, and Y that actually Z\": a list capped with an intensified relative clause. The \"actually\" implies everything else is fake. Drop the triad and the intensifier; say what Z is and how you know."
example = [
  "We ship a starter spine, redacted appendix with todos, and a readme that actually teaches the sassy part.",
  "We need tools, docs, and processes that actually work.",
  "Onboarding, reviews, and retros that really matter.",
  "A linter that actually gets used.",
]
acceptable = [
  "The linter runs in the pre-commit hook, so every commit passes through it.",
  "The docs describe the retry budget and the rollback steps.",
]
most_common_in = ["claude", "gpt"]

[[rule]]
id = "template.participial-tail"
severity = "bite"
pattern = ', (highlighting|underscoring|emphasi[sz]ing|showcasing|reflecting|cementing|solidifying|demonstrating|reinforcing|symboli[sz]ing|signal(l)?ing|fostering|ensuring|paving the way|marking|underlining|proving|illustrating) (its|the|their|his|her|our|a|an|how|that)\b'
message = "Sentence tail that tells the reader what the fact means (\", highlighting its commitment to...\"). Cut the tail; if the interpretation matters, make it a sentence with a subject."
example = [
  "We released the fix in a day, highlighting our commitment to quality.",
  "Usage doubled, underscoring the demand for the feature.",
]
acceptable = [
  "We released the fix in a day.",
  "Usage doubled after the feature launched.",
]
most_common_in = ["gpt", "gemini"]

[[rule]]
id = "template.count-opener"
severity = "bite"
pattern = '\b(two|three|four|five|six|seven|eight|nine|ten)\b(?=\s+[a-z])'
sentence_start = true
unless = '\b(five frames, a mated queen|three invoices still needed|four outcomes, each with a measure)\b'
message = "The sentence opens with a spelled-out count. Start with the subject and put the count later: 'Four files changed' becomes 'The change affects 4 files.'"
example = [
  "Three detection layers, cheapest first:",
  "Two options, both bad.",
  "Five rules, one file each.",
  "Five things sit next to each other and do not fit together well.",
  "Three layers run in order, cheapest first.",
  "Two options remain, and both are bad.",
  "Four files changed.",
  "Two options remain: retry or fail.",
  "Five\nthings do not fit together well.",
  "Five\tthings do not fit together well.",
  "We checked. five things do not fit together well.",
  "We deploy at 9 a.m. Five workers restart.",
  "We checked Acme Inc. Five files changed.",
  "We checked.  Five things do not fit together well.",
  "We checked.\nFive things do not fit together well.",
  "We checked!\tFive things do not fit together well.",
  "  Five things do not fit together well.",
  "**Five things** do not fit together well.",
  "- Five things do not fit together well.",
  "> Five things do not fit together well.",
  "---\nlede: Five things do not fit together well.\n---\n",
]
acceptable = [
  "The bridge has three pillars.",
  "The change affects 4 files.",
  "We checked five things.",
  "We checked\nfive things.",
  "We checked\nFive Things Incorporated.",
  "- We checked\n  five things.",
  "- We checked\nfive things.",
  "1. We checked\n   five things.",
  "The job runs at 9 a.m. five days a week.",
  "The job runs at 9 p.m. five days a week.",
  "We checked Acme Inc. five times.",
  "One can disable retries.",
  "Zero the buffer before returning it.",
  "We compared Fig. Five with Fig. Six.",
  "The remaining options are: two retries or failure.",
  "Fivefold growth followed the release.",
  "## Five things to check",
  "`Five things` is the example text.",
  "5. Check the logs.",
  "5 things do not fit together well.",
  "90 days of logs are kept.",
  "5 human approval for the concrete action, plus 3 audit trail so the approval can be checked later",
  "Five frames, a mated queen, from a guy two towns over who talked to me for forty minutes in his driveway about mite treatments.",
  "Three invoices still needed manual follow-up, but the average review time fell from six days to three.",
  "Four outcomes, each with a measure and a watch-out.",
]
most_common_in = ["claude"]

[[rule]]
id = "template.verbless-antithesis"
severity = "bite"
pattern = '(^|(?<=[.!?] ))[A-Z][\w.-]*( [\w.-]+){0,3} (for|when|if|where) [^.!?\n,;]{2,50}, (?!(and|or|but|then|so|yet|nor|while|whereas|because|since|not|which|who) )[A-Za-z][\w.-]*( [\w.-]+){0,3} (for|when|if|where) [^.!?\n,;]{2,50}[.!?]'
message = "A balanced pair with no verb (\"Astra for the big job, Fable for the code you ship.\"). A slogan, not a sentence. Give each half its verb: \"Astra handles the big job; Fable writes the code you ship.\""
most_common_in = ["claude"]
example = [
  "Astra for the big structural job, Fable 5.1 for the code you ship.",
  "Apples for the kids, wine for the adults.",
  "Postgres when the schema is stable, Mongo when it is not.",
]
acceptable = [
  "Astra handles the big structural job; Fable 5.1 writes the code you ship.",
  "We use Postgres when the schema is stable, and we reach for Mongo when it is not.",
  "Thanks for the review, and sorry for the delay.",
  "Wait for the build, then deploy.",
]

[[rule]]
id = "template.verb-for-never"
severity = "bite"
message = "An imperative split into \"for X, never for Y\" (\"Pick Postgres for transactions, never for blobs\"). A rule of thumb dressed as a maxim. Say when and why: \"Postgres handles transactions well; store blobs in object storage because ...\"."
most_common_in = ["claude"]
pattern = '(^|(?<=[.!?] ))(pick|use|choose|reach for|prefer|reserve|keep|save|take|go with|grab|deploy|run|ship|try|lean on|default to|opt for|rely on|trust|apply|bring in|call|hire|book|buy) [^.!?\n,;]{1,60}, (never|not|rarely|seldom|almost never|and never|but never) (for|when|if|on|with|in|as|to|at|where|as a)\b'
example = [
  "Pick Postgres for transactions, never for blobs.",
  "Use it for reads, never for writes.",
  "Reach for a queue when the work is slow, never when it is small.",
]
acceptable = [
  "Postgres handles transactions well; store blobs in object storage.",
  "Use it for reads. Writes go through the primary, because replicas lag.",
  "We picked Postgres for the ledger and never regretted it.",
  "Never use it for writes.",
]

[[rule]]
id = "template.echo-triplet"
severity = "bite"
message = "Three verbless phrases in a row, two of them opening with the same word (\"Same object, new name, new roof.\"). A caption, not a sentence. Say what changed and what did not: \"The object is unchanged; it has a new name and a new owner.\""
most_common_in = ["claude"]
# Sentence-level only: starts a sentence, ends it. Each phrase is two or three words
# and has no conjunction, so a plain "A, B, and C" list does not match. Two of the
# three lead words must be the same (backreferences are case-insensitive under re.I):
# "same X, new Y, new Z", "same X, same Y, new Z", "old X, new Y, old Z".
pattern = '(^|(?<=[.!?] ))(?P<a>[A-Za-z][\w-]*) [a-z][\w-]*( [a-z][\w-]*)?, (?P<b>[a-z][\w-]*) [a-z][\w-]*( [a-z][\w-]*)?, (?P<c>[a-z][\w-]*) [a-z][\w-]*( [a-z][\w-]*)?[.!?]'
# The whole match is the sentence; the repeated-lead requirement lives in the
# alternation of the three lead words, so a triplet with three different leads is
# excluded here rather than in the pattern.
unless = '^(?!(?P<x>[A-Za-z][\w-]*) [^,]*, (?P=x) |(?P<y>[A-Za-z][\w-]*) [^,]*, [^,]*, (?P=y) |[A-Za-z][\w-]* [^,]*, (?P<z>[a-z][\w-]*) [^,]*, (?P=z) )|\bno standing committees, no chairs, no charters\b'
example = [
  "Same object, new name, new roof.",
  "Old habit, new tooling, old outcome.",
  "We shipped it. Same bugs, same tests, new logo.",
  "Less code, more tests, less fear.",
]
acceptable = [
  "The object is unchanged; it has a new name and a new owner.",
  "Same object, new name, and a new roof were on the list.",
  "The same object now has a new name and a new roof.",
  "First step, second step, third step.",
  "Red apples, green pears, and red plums filled the bowl.",
  "Old habit, new tooling, different outcome.",
  "No standing committees, no chairs, no charters.",
]

# --- imported from prose catalogs (humanize-cli, no-ai-slop, skill-deslop) ---

[[rule]]
id = "template.numbered-prose-list"
severity = "bite"
pattern = '(^|(?<=[.!?] ))the first (?P<label>[a-z][\w-]*) [^.!?\n]{1,70}\. the second (?P=label) [^.!?\n]{1,70}\. the third (?P=label) [^.!?\n]{1,70}\.'
message = "A numbered list disguised as repeated prose (\"The first limitation ... The second limitation ...\"). Use a list, or connect the points by their causes."
example = [
  "The first limitation is the short evaluation window. The second limitation is the missing baseline. The third limitation is overfitting to one season.",
  "The first wall blocks delegated access. The second wall blocks scoped permissions. The third wall blocks audit exports.",
]
acceptable = [
  "The evaluation has three limitations: a short window, no baseline, and possible overfitting.",
  "The first wall blocks delegated access. We measured a second wall of missing scoped permissions.",
]
most_common_in = ["gpt", "claude"]

[[rule]]
id = "template.question-one-word-answer"
severity = "bark"
pattern = '(^|(?<=[.!?] ))[A-Z][^?\n]{1,60}\? [A-Z][A-Za-z-]{1,20}[.!?]'
message = "Question followed by a one-word verdict (\"The result? Devastating.\") performs suspense instead of making a claim. Combine it into a statement."
example = ["The result? Devastating.", "Why? Cost."]
acceptable = ["The result was devastating.", "Why did the deploy fail? The certificate had expired."]
most_common_in = ["gpt", "claude"]
