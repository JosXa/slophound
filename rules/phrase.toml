[[rule]]
id = "phrase.scope-inflation"
severity = "bark"
pattern = '\b(extend(s|ed|ing)?|go(es|ing)?|reach(es|ed|ing)?) (far )?beyond\b'
unless = '\b(meters?|feet|kilometers?|miles?|fence|property|border|boundary|range|distance)\b'
message = "Scope inflation (\"extends far beyond\") gestures at a larger point without naming it. State the additional effect, system, or audience."
example = [
  "The impact extends far beyond the immediate outage.",
  "This goes far beyond a cache change.",
  "The project reaches beyond the usual boundaries.",
]
acceptable = [
  "The property line extends beyond the fence by 2 meters.",
  "The outage delayed invoices and prevented customers from changing their plans.",
]
most_common_in = ["gpt", "gemini", "llama"]

[[rule]]
id = "phrase.insight-vending"
severity = "bark"
pattern = '\b(provid(e|es|ed|ing)|offer(s|ed|ing)?) (valuable|actionable|meaningful) insights?\b|\b(gain(s|ed|ing)?|develop(s|ed|ing)?) a (deeper|better|greater) (understanding|appreciation)\b|\bprovid(e|es|ed|ing)? a comprehensive (overview|understanding)\b'
message = "Generic insight claim (\"provide valuable insights\", \"gain a deeper understanding\") sells the benefit without the finding. Name what the reader learns or what the evidence shows."
example = [
  "The dashboard provides valuable insights into cache behavior.",
  "The report offers actionable insights for the team.",
  "The workshop helps engineers gain a deeper understanding of retries.",
  "The course develops a better appreciation of failure modes.",
  "This section provides a comprehensive overview of the rollout.",
]
acceptable = [
  "The dashboard shows cache hits, misses, and eviction reasons for each tenant.",
  "The report explains which retry paths can create duplicate writes.",
]
most_common_in = ["gpt", "gemini", "qwen"]

[[rule]]
id = "phrase.corporate-boilerplate"
severity = "bark"
pattern = '\b(culture of continuous (improvement|learning|innovation)|commitment to continuous improvement|loyal customer base|unique value proposition|sustain(ed|able) competitive advantage|maintain(ing|s)? (its |a )?competitive edge|proven track record|exceptional customer service|strong brand identity)\b'
message = "Corporate boilerplate (\"culture of continuous improvement\", \"competitive edge\") names a business aspiration instead of evidence. State the practice, measure, customer behavior, or advantage."
example = [
  "The company promotes a culture of continuous improvement.",
  "Leaders show a commitment to continuous improvement.",
  "The product has a loyal customer base.",
  "The feature has a unique value proposition.",
  "The integration creates a sustainable competitive advantage.",
  "The company maintains its competitive edge.",
  "The vendor has a proven track record.",
  "Support delivers exceptional customer service.",
  "The company has a strong brand identity.",
]
acceptable = [
  "The dashboard shows each metric in a KPI column.",
  "Ninety percent of customers renewed after the new export reduced the monthly close by two days.",
]
most_common_in = ["gpt", "gemini", "qwen"]

[[rule]]
id = "phrase.informed-decision"
severity = "bark"
pattern = '\b(make|makes|made|making) (more )?informed (decisions?|choices)\b|\bmake an informed decision\b'
message = "Empty decision claim (\"make informed decisions\"). Name the decision and the evidence that changes it."
example = [
  "The dashboard helps managers make informed decisions.",
  "The results let teams make more informed choices.",
  "The team is making informed decisions about the migration.",
  "Use the report to make an informed decision.",
]
acceptable = [
  "The team chose Postgres after the load test showed Redis could not retain the audit history.",
  "The contract uses the phrase \"informed decision\" to define consent.",
]
most_common_in = ["gpt", "gemini", "qwen"]

[[rule]]
id = "phrase.procedural-precondition"
severity = "bite"
pattern = '\b(one must first|must first (understand|recognise|recognize|consider|acknowledge))\b'
message = "Formal procedural wind-up (\"one must first\"). State the prerequisite directly or start the ordered list with the action."
example = [
  "One must first understand the cache key before changing its TTL.",
  "You must first recognize the lock ordering.",
  "We must first consider the migration window.",
  "An operator must first acknowledge the alert.",
]
acceptable = [
  "Read the cache key before changing its TTL.",
  "First, acknowledge the alert, then inspect the lock ordering.",
]
most_common_in = ["gpt", "gemini", "qwen"]
