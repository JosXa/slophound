# slophound rules: punctuation and typography (regex layer).
#
# These rules run on the masked view, which still has the original characters
# (code, URLs, tables, front matter and HTML are blanked; nothing is
# normalised). They care about the literal glyph, so \u escapes name the
# character being caught.
#
# Same fields as rules/phrase.toml, plus the optional [rule.jev_veto] table
# documented in rules/noun.toml.

[[rule]]
id = "punct.em-dash"
severity = "bite"
pattern = '\s?\u2014(?!\s*and\b)\s?|\s\u2013\s|\s--\s'
headings = true
message = """Em dash. Rewrite the sentence to state how its parts relate. Do not substitute a semicolon, spaced en dash, or double hyphen. \
Choose a connective that preserves the meaning, without inventing a cause, contrast, condition, or timing. \
Do not insert a comma mechanically before every connective. Examples by relationship: \
Reason: "The request failed because the token expired." "Given that the replica is behind, read from the primary." \
Consequence: "The token expired, so the client signed in again." "The replica is behind, which means its results may be stale." \
Contrast: "The cache is fast, but its results can be stale." "The CLI prints errors, while the API returns them." \
"The old endpoint accepts XML, whereas the new one accepts JSON." \
Concession: "Although the cache is warm, the first query is slow." "The request succeeded even though the replica was offline." \
Simultaneous action: "The worker checks the next file while the upload runs." "The index rebuilds at the same time as the backup runs." \
Condition: "Retry if the server returns 503." "Keep the connection open unless the client disconnects." \
Sequence: "After the upload finishes, delete the temporary file." "Check the signature before you extract the archive." \
Addition: "The command checks syntax and reports unused imports." \
Explanation: "The request needs one header, namely Authorization." \
Detail: "The cache, which refreshes every minute, serves these reads." \
Sometimes no connective is needed: "Counts signposts per 100 prose words, excluding short documents." \
"The cache, once warm, serves most reads." "It failed twice." \
Use separate sentences for separate instructions: "Save the file. Open the settings page." \
Use commas or parentheses for an aside and a colon for an explanation or list only when the syntax calls for it. \
Preserve an existing connective, removing the dash and adjusting spacing. Do not replace every dash with the same construction."""
repeat_message = "Em dash. State the relationship with a suitable connective or split the sentence. Preserve the meaning. Do not substitute a semicolon. See the examples at the first punct.em-dash finding in this report."
example = ["The cache\u2014once warm\u2014serves most reads.", "It failed \u2013 twice.", "It failed -- twice.", "We shipped\u2014andromeda is the release name.", "We shipped\u2014but the test failed."]
acceptable = [
  "The cache, once warm, serves most reads.",
  "Pages 12\u201314 cover the setup.",
  "Use --verbose for more output.",
  "We built it \u2014 and shipped it.",
  "We built it\u2014and shipped it.",
  "We built it \u2014\nAND shipped it.",
  "The request failed because the token expired.",
  "Given that the replica is behind, read from the primary.",
  "The token expired, so the client signed in again.",
  "The replica is behind, which means its results may be stale.",
  "The cache is fast, but its results can be stale.",
  "The CLI prints errors, while the API returns them.",
  "The old endpoint accepts XML, whereas the new one accepts JSON.",
  "Although the cache is warm, the first query is slow.",
  "The request succeeded even though the replica was offline.",
  "The worker checks the next file while the upload runs.",
  "The index rebuilds at the same time as the backup runs.",
  "Retry if the server returns 503.",
  "Keep the connection open unless the client disconnects.",
  "After the upload finishes, delete the temporary file.",
  "Check the signature before you extract the archive.",
  "The command checks syntax and reports unused imports.",
  "The request needs one header, namely Authorization.",
  "The cache, which refreshes every minute, serves these reads.",
  "Counts signposts per 100 prose words, excluding short documents.",
  "It failed twice.",
  "Save the file. Open the settings page.",
]
most_common_in = ["gpt", "claude", "gemini"]

[[rule]]
id = "punct.em-dash-and"
severity = "bite"
pattern = '\u2014\s*and\b'
headings = true
message = "Drop the em dash before 'and' entirely. Keep 'and' and a single space between the joined words. Do not replace the dash with a semicolon or other punctuation. For example, write \"We built it and shipped it.\""
example = ["We built it \u2014 and shipped it.", "We built it\u2014and shipped it.", "We built it \u2014\tand shipped it.", "We built it \u2014\nAND shipped it."]
acceptable = ["We built it and shipped it.", "We built it \u2014 but have not shipped it.", "We shipped\u2014andromeda is the release name.", "It failed \u2013 and retried.", "It failed -- and retried."]

[[rule]]
id = "punct.curly-quotes"
severity = "bite"
pattern = '[\u201c\u201d\u2018\u2019]'
headings = true
unless = 'in today\u2019s hearing'
message = "Typographic quote. Use straight quotes (\" and ') in documents that live in a repository."
example = ["He called it \u201cdone\u201d.", "It\u2019s fine."]
acceptable = ["He called it \"done\".", "It's fine.", "In today\u2019s hearing, the committee considered the bill."]
most_common_in = ["gpt", "claude"]

# Off by default: emoji are a taste, not a machine tell. The CLI skips this
# rule unless --no-emoji is passed (see hound/cli.py). The test runner still
# proves it like every other rule.
[[rule]]
id = "punct.emoji"
severity = "bite"
pattern = '[\U0001F300-\U0001FAFF\u2600-\u27BF\u2B50\u2705\u274C]\uFE0F?'
headings = true
message = "Emoji decorating prose. Delete it."
example = ["## Getting started \U0001F680", "Done \u2705"]
acceptable = ["## Getting started", "Done."]

[[rule]]
id = "punct.decorative-separator"
severity = "bite"
pattern = '\s[\u00b7\u2022\u2192\u21d2]\s'
headings = true
message = "Middle dot, bullet, or arrow used as inline decoration. Use a comma, a list, or a plain word."
example = ["Fast \u00b7 Simple \u00b7 Correct", "Request \u2192 Queue \u2192 Worker"]
acceptable = ["Fast, simple, and correct.", "The request goes to the queue, then to a worker."]

# Two independent clauses glued with a semicolon. Models reach for this the
# moment em dashes are banned: same pause, same dodge of the word that would
# say how the halves relate. The regex only sees the shape (word; lowercase
# word, no connective after it); Jev reads the sentence and clears the ones a
# careful writer would have kept. Excluded up front: HTML entities, a
# connective after the semicolon, and a second half starting with a capital.
[[rule]]
id = "punct.semicolon-splice"
severity = "bark"
pattern = '''(?<!&)\b[a-z]+[)"'\]]*; +(?!(?:and|but|or|nor|so|yet|then|therefore|thus|hence|however|otherwise|consequently|accordingly|instead|meanwhile|nevertheless|nonetheless|moreover|furthermore|besides|likewise|still|also|indeed|rather|e\.g|i\.e)\b)(?=(?-i:[a-z]))'''
message = "Semicolon joining clauses whose relationship could be stated directly. Replacing an em dash with a semicolon does not explain that relationship. Use 'because' or 'given that' for a reason, 'so' for a consequence, 'but' or 'whereas' for a contrast, 'although' for a concession, 'while' or 'at the same time as' for simultaneous action, or 'if' for a condition. Choose only a relationship supported by the text. For example, write \"The cache is fast, but its results can be stale.\" When the second half only adds a fact, do not glue it on with 'and'. Rewrite the sentence so one idea carries the other: \"Any Collaborator can upload a new revision; that revision records its uploader\" becomes \"Every revision records the Collaborator who uploaded it.\" Use a period for a separate thought. Keep a semicolon when it deliberately balances parallel clauses or separates list items containing commas."
example = ["The cache is fast; it lies under load.", "Half the developers stay silent; they stopped caring long ago.", "The path is documented; what remains is choosing it.", "The build brief sets the rules; attendees make every other design choice themselves."]
acceptable = ["The cache is fast, but it lies under load.", "The cache is fast, but its results can be stale.", "The cache is fast; but it lies under load.", "The conversion is not always possible; therefore we keep the helper functions.", "The index is rebuilt nightly; consequently the first query is slow.", "We ship on Monday; Tuesday is the retrospective.", "Fish &amp; chips and &#160; tea.", "Speakers: Ada Lovelace, London; Alan Turing, Manchester."]
most_common_in = ["claude", "gpt", "gemini"]

[rule.jev_veto]
instructions = "Look at the semicolon in `matched_text` and the two halves of the sentence it joins. Is the semicolon the right punctuation here, so that the sentence reads best with it? Judge the relation between the halves, not grammar."
threshold = 0.6
criteria.true = "Keep the semicolon. The halves are grammatically parallel statements that mirror each other word for word in structure, so the reader holds them side by side as a balanced pair ('The humorous story is told gravely; the comic story is shouted.'), or the semicolon separates list items that themselves contain commas."
criteria.false = "The semicolon stands in for a missing connective. The second half gives the cause, consequence, contrast, concession, qualification, remainder, or punchline of the first, so a connective such as 'because', 'so', 'but', 'while', 'whereas', or 'although' would state the relation the semicolon leaves implicit, or the second half merely adds a fact that a rewrite could fold into the first. This includes a division of labor where the second half covers what the first leaves over ('the spec fixes the API; each team picks its own storage'). It also includes a separate thought that should be its own sentence."

[[rule]]
id = "punct.bold-label-restates"
severity = "bark"
pattern = '^[ \t]*(?:[-*+]|\d+[.)])[ \t]+\*\*([A-Za-z][^*:\n]{1,40}):?\*\*:?[ \t]*\1\b'
message = "Bold label that restates the sentence following it. Drop the label."
example = ["- **Performance:** Performance improved by 40%."]
acceptable = ["- **Performance:** p95 latency fell by 40%.", "- p95 latency fell by 40%."]
most_common_in = ["gpt", "claude"]

[[rule]]
id = "punct.mid-sentence-colon"
severity = "sniff"
pattern = "\\b(if you'?re coming from|for those (familiar|unfamiliar) with|in practice|put differently|the short version|the (tl;dr|tldr)) [^.!?\\n:]{0,60}:\\s+[a-z]"
message = "Colon as a mid-sentence connector. Let the clause stand as its own sentence."
example = ["If you're coming from traditional automation: instead of handlers, you describe conditions."]
acceptable = ["Three formats are supported: JSON, YAML, and TOML."]

[[rule]]
id = "punct.emphasized-copula"
severity = "bite"
pattern = '(?<![*\w])\*(is|are|was|were|not|does|do|did|will|can)\*(?![*\w])|(?<![_\w])_(is|are|was|were|not|does|do|did|will|can)_(?![_\w])'
message = "Italicized function word for stress (\"this *is* the fix\"). Spoken emphasis does not survive on the page; restructure the sentence so the contrast is in the words."
example = ["This *is* the fix.", "The queue _was_ the bottleneck."]
acceptable = ["This is the fix.", "Use *emphasis* for terms, not for stress."]
most_common_in = ["claude", "gpt"]
