# slophound verb rules. Detection layer: spaCy part-of-speech + dependency parse.
#
# These rules catch verbs that language models use figuratively where a person
# would name the concrete effect: "that buys us a week", "that holds", "the fix
# lands", "this unlocks". A regex cannot tell "the worker holds a mutex" (fine)
# from "that holds even under load" (slop); the parse can, because the slop
# version has a pronoun subject and no object.
#
# Fields per [[rule]]:
#   id            "verb.<slug>", unique. Must start with "verb.".
#   severity      "bark" by default for this layer: the parser is small and
#                 sometimes wrong, so grammar-inferred findings never fail a
#                 run unless --strict is given.
#   dependency    A spaCy DependencyMatcher pattern: a list of nodes, or a list
#                 of such lists when several alternative shapes should fire
#                 the same rule (see verb.buys-us). Within a pattern the first
#                 node is the anchor {RIGHT_ID, RIGHT_ATTRS}. Every other node
#                 has LEFT_ID (an earlier node), REL_OP (">" = direct child of
#                 LEFT_ID, "<" = parent, ">>" = descendant) and its own
#                 RIGHT_ID / RIGHT_ATTRS. Attribute keys: LEMMA, POS, TAG, DEP,
#                 LOWER, ORTH. Values may be strings or {IN = [...]} /
#                 {NOT_IN = [...]}. Use {REGEX = "(?i)^...$"} when a label's
#                 lemma retains capitalization; anchor it to the whole token.
#                 Docs: https://spacy.io/usage/rule-based-matching#dependencymatcher
#   unless        Optional regex, tested case-insensitively against the whole
#                 sentence that contains the match. If it matches, the finding
#                 is dropped. Use it to express "no object" or other things the
#                 matcher cannot say directly.
#   message       Shown verbatim under the offending line. Say what to write
#                 instead.
#   example       One or more sentences that MUST trigger this rule.
#   acceptable    One or more sentences that MUST NOT trigger it. Both lists
#                 are required and checked by `./slophound test`.
#   most_common_in  Informational: model families where the pattern shows up.
#
# Parser caveat: en_core_web_sm is small and sometimes tags a verb as a noun
# ("This lands next sprint" -> lands/NOUN). Examples here are chosen so the
# parse is right; if a real sentence slips through, add a phrase rule for it
# rather than fighting the parser.
#
# Tag reference for subjects: TAG="DT" matches demonstrative pronouns used as
# subjects ("this", "that", "which" is WDT), TAG="PRP" matches personal pronouns
# ("it", "she", "we"). Most figurative uses have a demonstrative subject:
# "That buys us", "This holds", "This unlocks".
#
# False positive? Do not rewrite the document around it. Fix the rule: narrow
# the dependency pattern or add the sentence to `acceptable`, run
# `./slophound test`, then offer to upstream the change.

[[rule]]
id = "verb.buys-us"
severity = "bark"
message = "\"buys (us) X\" is a Claude reflex for trading one thing for another. Name the trade: what was spent, what was gained, and for how long."
most_common_in = ["claude"]
# Two alternative patterns: a demonstrative or gerund subject ("That buys",
# "Caching buys"), or any subject with "us" as the beneficiary ("The refactor
# buys us time").
dependency = [
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "buy", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = { IN = ["nsubj", "csubj"] }, TAG = { IN = ["DT", "WDT", "VBG"] } } },
  ],
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "buy", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">>", RIGHT_ID = "us", RIGHT_ATTRS = { LOWER = "us" } },
  ],
]
unless = "\\bbuys? us (lunch|coffee|dinner|drinks|beer|pizza|food|breakfast|tickets|a round)\\b"
example = [
  "That buys us a week of headroom.",
  "This buys a clean seam between the two services.",
  "Caching the token buys us time until the refactor.",
  "The refactor buys us time.",
  "Moving the check earlier buys us a cheaper failure mode.",
]
acceptable = [
  "She buys milk on the way home.",
  "The company buys back shares every quarter.",
  "Finance buys the licenses in bulk.",
  "The office manager buys us lunch on Fridays.",
  "He buys the team coffee.",
]

[[rule]]
id = "verb.holds"
severity = "bark"
message = "\"that holds\" asserts an argument survives without saying what was tested. State the condition it survives and what would break it."
most_common_in = ["claude"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "hold", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", TAG = { IN = ["DT", "WDT"] } } },
]
unless = "\\bh(o|e)ld(s|ing)? (the|a|an|its|our|their|your|my|his|her|up|off|on|back|out|\\d|two|three|several|many|no)\\b"
example = [
  "That holds even under load.",
  "That still holds.",
  "This holds for every tenant we have looked at.",
]
acceptable = [
  "That holds the lock for too long.",
  "The worker holds a mutex.",
  "This holds up under review.",
]

# Technical containment should use "contains" or "stores", even when "holds"
# is factually correct. Both nouns matter: a file holding configuration is the
# target; a cabinet holding files and a worker holding a mutex are literal uses.
# Keep this separate from verb.holds, whose sentence-wide object exclusion
# would suppress precisely the transitive construction this rule detects.
# Label heads such as Rules, Playbook and Draft can retain capitalization and
# plural endings in their lemmas. Match those types without requiring authors
# to append "database" or "field" to every name. The content object is still
# required so physical cards, boundaries and drafts can use "hold" literally.
[[rule]]
id = "verb.holds-content"
severity = "bark"
message = "Overused containment verb (\"the file holds the configuration\"). Use 'contains' or 'stores' for data, or name the document's action: 'the field records the decision', 'the document explains the reasoning'."
most_common_in = ["claude"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "hold", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", LEMMA = { REGEX = "(?i)^(file|document|page|section|report|guide|spec|specification|plan|manifest|field|column|row|record|entry|object|array|list|map|dictionary|set|table|collection|cache|queue|buffer|database|store|storage|memory|variable|constant|attribute|property|config|configuration|schema|module|class|struct|structure|repository|repo|directory|folder|package|payload|request|response|body|header|message|log|registry|index|dataset|state|context|component|service|system|container|node|bucket|snapshot|fixture|dropdown|rules?|playbooks?|drafts?|boundar(y|ies)|cards?|this|that|these|those|it|which)$" } } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", LEMMA = { IN = ["configuration", "config", "setting", "option", "default", "parameter", "value", "data", "metadata", "content", "text", "information", "detail", "record", "entry", "row", "check", "item", "element", "key", "token", "credential", "secret", "password", "identifier", "id", "name", "path", "url", "address", "file", "document", "object", "result", "response", "request", "message", "event", "definition", "rule", "schema", "state", "context", "history", "decision", "reasoning", "rationale", "meaning", "intent", "intention", "assumption", "argument", "explanation", "instruction", "requirement", "logic", "knowledge", "summary", "description", "example", "evidence", "mapping", "dependency"] } } },
]
example = [
  "The file holds the configuration.",
  "The map holds three keys.",
  "The field holds the reasoning.",
  "Two dropdowns hold the decision.",
  "The document holds the rationale.",
  "The cache holds recently fetched responses.",
  "The schema holds the validation rules.",
  "The registry holds the service definitions.",
  "A variable held the previous result.",
  "The module is holding all defaults.",
  "This holds the configuration.",
  "It holds all the settings.",
  "These hold the settings.",
  "The file holds the configuration while the worker holds a mutex.",
  # From the Agent Access Profile pages: names and labels can be proper nouns.
  "Agent Access Rules holds one row per sensitive action.",
  "Agent Playbook holds one row per workflow.",
  "A Draft may hold only the planned check.",
  "The Boundary holds the text.",
  "The card holds the decision.",
  "The drafts hold the planned checks.",
  "The DRAFT holds the configuration.",
  "The rules hold the decision.",
]
acceptable = [
  "The file contains the configuration.",
  "The map stores three keys.",
  "The field records the decision.",
  "The document explains the reasoning.",
  "The worker holds a mutex.",
  "That holds the lock for too long.",
  "The cache holds a lock while updating its entries.",
  "The engineer holds a different view.",
  "She holds the file in her hand.",
  "The cabinet holds the files.",
  "The tank holds twenty litres.",
  "The contract holds the supplier responsible.",
  "The cache holds on to old entries.",
  "The file contains the configuration while the worker holds a mutex.",
  "The report quotes `the file holds the configuration` as an example.",
  "Agent Access Rules contains one row per sensitive action.",
  "Agent Playbook contains one row per workflow.",
  "A Draft may contain only the planned check.",
  "The Boundary states what the agent may and must not do.",
  "The card records the decision.",
  "The boundary holds the cattle inside the field.",
  "The card holds the door open.",
  "The draft holds the door against its frame.",
  "The cabinet holds a row of files.",
  "She holds the check in her hand.",
  "The worker holds a mutex while Agent Playbook stores the workflow.",
  "The Guard holds the file.",
  "Agent Playbook holds a lock during updates.",
]

[[rule]]
id = "verb.lands"
severity = "bark"
message = "Code does not \"land\". Say merged, deployed, or released, and when."
most_common_in = ["claude", "gpt"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "land", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = { IN = ["nsubj", "nsubjpass"] }, LEMMA = { IN = ["fix", "feature", "change", "pr", "patch", "commit", "release", "work", "refactor", "migration", "branch", "update", "version", "this", "that", "it", "rewrite", "improvement", "code"] } } },
]
example = [
  "The fix lands in main tomorrow.",
  "Once the feature lands, we can delete the flag.",
  "The change lands next sprint.",
]
acceptable = [
  "The plane lands at noon.",
  "The ball landed in the neighbour's garden.",
  "She landed the job after two interviews.",
]

[[rule]]
id = "verb.unlocks"
severity = "bark"
message = "\"unlocks\" promises value without naming it. Say what becomes possible and why it was blocked before."
most_common_in = ["claude", "gpt"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "unlock", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = { IN = ["nsubj", "csubj"] }, TAG = { IN = ["DT", "WDT", "VBG"] } } },
]
example = [
  "This unlocks faster deploys.",
  "That unlocks a whole class of optimisations.",
  "Splitting the table unlocks parallel writes.",
]
acceptable = [
  "The key unlocks the door.",
  "The admin unlocks the account after verification.",
  "Users unlock the phone with a fingerprint.",
]

[[rule]]
id = "verb.surfaces"
severity = "bark"
message = "\"surfaces\" as a verb hides who shows what to whom. Say where the information appears and who sees it."
most_common_in = ["claude"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "surface", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj" } },
]
example = [
  "Doing so surfaces the bug earlier.",
  "The tool surfaces slow queries to the on-call engineer.",
]
acceptable = [
  "The submarine surfaced at dawn.",
  "The API surface grew by twelve endpoints.",
  "The road surface needs repair.",
]

[[rule]]
id = "verb.leans-on"
severity = "bark"
message = "\"leans on\" is vague about dependency. Say depends on, calls, or reads, and what happens when that thing is missing."
most_common_in = ["claude"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "lean", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "prep", RIGHT_ATTRS = { DEP = "prep", LOWER = "on" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", TAG = { IN = ["DT", "WDT", "NN", "NNS", "NNP"] } } },
]
example = [
  "This leans on the cache heavily.",
  "The scheduler leans on Redis for locking.",
]
acceptable = [
  "He leaned on the railing and watched the river.",
  "She leans on her sister for advice.",
]

[[rule]]
id = "verb.settles"
severity = "bark"
message = "\"that settles it\" declares a debate closed without showing the evidence. State the fact that decides it."
most_common_in = ["claude"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "settle", POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", TAG = { IN = ["DT", "WDT"] } } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", LEMMA = { IN = ["question", "debate", "it", "matter", "argument", "discussion", "issue"] } } },
]
example = [
  "That settles the question.",
  "This settles the debate about sharding.",
]
acceptable = [
  "The dust settles after a few minutes.",
  "The family settled in Hamburg in 1998.",
  "The court settled the case out of court.",
]

[[rule]]
id = "verb.demonstrative-enables"
severity = "bark"
message = "\"this enables/allows/ensures X\" states a benefit with no actor. Name who does what as a result."
most_common_in = ["gpt", "claude", "gemini"]
dependency = [
  { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = { IN = ["enable", "ensure", "empower", "streamline", "elevate"] }, POS = "VERB" } },
  { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", TAG = { IN = ["DT", "WDT"] } } },
]
unless = "\\btechnical architecture\\b.*\\benables\\b.*\\bartifact flows\\b"
example = [
  "This enables teams to ship faster.",
  "This ensures consistency across the platform.",
  "This empowers developers to focus on features.",
]
acceptable = [
  "The flag enables the new parser for 5% of traffic.",
  "The retry loop ensures every message is delivered at least once.",
  "Two reviewers must approve before merge.",
  "This page describes the technical architecture that enables artifact flows.",
]

[[rule]]
id = "verb.sits"
severity = "bark"
message = "A pronoun \"sits\" or \"lives\" somewhere (\"Both sit at the top\", \"this lives in the config layer\"). A ranking or location dressed as furniture. Say what it is: \"Both are frontier models\", \"the config layer owns this\"."
most_common_in = ["claude", "gpt"]
dependency = [
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = { IN = ["sit", "live"] }, POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", TAG = { IN = ["DT", "WDT"] } } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "place", RIGHT_ATTRS = { DEP = { IN = ["prep", "advmod"] }, LOWER = { IN = ["at", "in", "on", "behind", "between", "under", "above", "below", "beneath", "alongside", "atop", "inside", "outside", "there", "here", "downstream", "upstream"] } } },
  ],
]
unless = "\\blive[sd]? in (?!(the|a|an|one|our|its|that|this|your|their|every|each) )\\S|\\b(sit|sits|sat|sitting|live|lives|lived|living) (well|right|badly|uneasily|comfortably|oddly) with\\b|\\b(both|these|those|they|we) (sit|sat|live|lived) (at|in|on) (the|a|an) (front|back|table|desk|bench|chair|couch|floor|room|office|city|town|country|house|flat|apartment)\\b"
example = [
  "Both sit at the top.",
  "This sits behind a feature flag.",
  "That sits in the middle of the range.",
  "This lives in the config layer.",
]
acceptable = [
  "The sensor sits at the top of the mast.",
  "Both live in Berlin.",
  "She sits at the front.",
  "This sits well with me.",
  "The config lives in one file.",
]

# "carry" with an abstract object. Literal carrying (boxes, tons, passengers,
# headers, ids, a signal on a wire) is fine, so the object lemma is the gate,
# not the subject: "the field carries the reasoning" and "this carries risk"
# are the same tell whether the subject is a noun or a demonstrative.
# The second pattern covers comments, dropdowns, roles and prevention strengths
# in documents. Require a document subject there to avoid transport and acting.
# Library subjects also cover software layers without flagging physical layers
# on substrates. In "layer two", spaCy makes "two" the object and "layer" its
# compound, so numbered layers need a separate pattern.
[[rule]]
id = "verb.carries"
severity = "bark"
message = "Overused verb for content or abstract meaning (\"two dropdowns carry the decision\", \"each card carries the dropdowns\", \"this carries weight\"). Say what the thing records or shows, or what the person does: \"the dropdowns record the decision\", \"the card shows the dropdowns\", \"reviewers take this seriously\". For libraries that \"carry\" a software layer, say which libraries the layer uses."
most_common_in = ["claude"]
dependency = [
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "carry", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = { IN = ["nsubj", "csubj"] }, TAG = { NOT_IN = ["PRP", "NNP", "NNPS"] } } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", LEMMA = { IN = ["decision", "weight", "meaning", "reasoning", "reason", "risk", "responsibility", "intent", "intention", "message", "signal", "story", "argument", "implication", "context", "burden", "authority", "information", "knowledge", "judgment", "judgement", "assumption", "rationale", "logic", "narrative", "insight", "nuance", "tension", "cost", "consequence", "significance", "connotation", "baggage", "expectation", "obligation", "promise", "conviction", "tone", "sentiment", "emotion", "feeling", "idea", "lesson", "wisdom", "truth", "history", "memory", "identity", "spirit", "hope", "urgency"] } } },
  ],
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "carry", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", LEMMA = { REGEX = "(?i)^(card|document|field|file|form|page|profile|record|row|rule|template)$" } } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", LEMMA = { IN = ["comment", "dropdown", "strength", "role"] } } },
  ],
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "carry", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", LEMMA = "library" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", LEMMA = "layer" } },
  ],
  [
    { RIGHT_ID = "verb", RIGHT_ATTRS = { LEMMA = "carry", POS = "VERB" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = { DEP = "nsubj", LEMMA = "library" } },
    { LEFT_ID = "verb", REL_OP = ">", RIGHT_ID = "obj", RIGHT_ATTRS = { DEP = "dobj", POS = "NUM" } },
    { LEFT_ID = "obj", REL_OP = ">", RIGHT_ID = "layer", RIGHT_ATTRS = { DEP = "compound", LEMMA = "layer" } },
  ],
]
unless = "\\bcarr(y|ies|ied|ying) (the |a |an )?(signal|message)s? (to|from|over|across|through|between|on|into|out of|back)\\b|\\bcarr(y|ies|ied|ying) (a |the )?(risk|cost) of (\\d|[a-z]+ (percent|per cent|euros?|dollars?|ms|seconds?|minutes?))"
example = [
  "Two dropdowns carry the decision.",
  "The field carries the reasoning.",
  "This carries real risk.",
  "That carries weight with reviewers.",
  "The flag carries no meaning outside this module.",
  "Each name carries an assumption about ownership.",
  "each row must carry an explicit reason or a stronger control.",
  "Every rule carries a Required prevention strength (None, Guide, Gate, Constrain, Remove) and an Agent's permitted role (from Execute freely down to No access).",
  "Each card carries the three dropdowns.",
  "The field carries the agent's permitted role.",
  "The Card carries the three dropdowns.",
  "Established NLP libraries carry layer two.",
  "The libraries carry the parsing layer.",
  "Each file carries enough comments at the top that an agent can add or repair a rule without reading any other documentation.",
]
acceptable = [
  "She carried the box upstairs.",
  "The truck carries forty tons.",
  "The cable carries ten gigabits per second.",
  "The bus carries passengers to town.",
  "Each request carries a correlation id in its header.",
  "The response carries a Retry-After header.",
  "The name carries over from the old schema.",
  "The wire carries the signal to the receiver.",
  "Kafka carries the message from the producer to the consumer.",
  "The two dropdowns record the decision, and the free-text field explains why.",
  "Each row must state an explicit reason or specify a stronger control.",
  "Every rule records a Required prevention strength and an Agent's permitted role.",
  "Each card shows the three dropdowns.",
  "The field records the agent's permitted role.",
  "The request carries a signal strength measurement.",
  "She carries the reason for her departure in a sealed envelope.",
  "The lorry carries a dropdown tailgate.",
  "The rule carries over to the next release.",
  "Layer two uses established NLP libraries.",
  "The substrate carries a protective layer.",
  "The libraries carry books on parsing.",
  "Each file contains enough comments at the top that an agent can add or repair a rule without reading any other documentation.",
  "She carries a file of comments to the meeting.",
  # RFC 7231, section 5.4: literal transport of credentials.
  "Two header fields are used for carrying authentication credentials, as defined in [RFC7235].",
]

# A copula whose complement is a whole clause: "The result is where the advice
# comes from", "AGENTS.md is what makes or breaks agents", "Caching is how we got
# the latency down". The subject owns no verb; the action hides behind
# where/what/why/how. Humans write this rarely (Conan Doyle 0.1 per 1k words,
# RFC 7231 0.03) and mostly with a demonstrative subject ("That is why we left",
# "This is what began it all"), which is a normal back-reference and stays clean.
# The parser attaches the clause to the copula as ccomp, and the WRB/WP token
# sits inside that clause, so the rule anchors on the copula and walks down.
[[rule]]
id = "verb.copula-cleft"
severity = "bark"
message = "A noun, a copula, and the whole action parked in a where/what/why/how clause (\"The 2025 result is where most lean-file advice comes from\"). The subject does nothing. Give it the verb: \"Most lean-file advice traces back to the 2025 result.\""
most_common_in = ["claude"]
dependency = [
  [
    {RIGHT_ID = "cop", RIGHT_ATTRS = {LEMMA = "be", DEP = "ROOT"}},
    {LEFT_ID = "cop", REL_OP = ">", RIGHT_ID = "subj", RIGHT_ATTRS = {DEP = "nsubj", TAG = {IN = ["NN", "NNS", "NNP", "NNPS", "VBG"]}}},
    {LEFT_ID = "cop", REL_OP = ">", RIGHT_ID = "clause", RIGHT_ATTRS = {DEP = "ccomp"}},
    {LEFT_ID = "clause", REL_OP = ">>", RIGHT_ID = "wh", RIGHT_ATTRS = {TAG = {IN = ["WRB", "WP"]}, LOWER = {IN = ["where", "what", "why", "how"]}}},
  ],
]
# "The question is whether", "the problem is that" are ordinary framing and do
# not use a wh-word, so they never match. Guard the remaining literal senses:
# a place or a named person as subject.
unless = '\b(room|building|office|city|town|street|house|kitchen|garage|station|floor|shelf|drawer|folder|directory|table|column|line \d+|page \d+|section \d+) (is|was|are|were) (where|what|why|how)\b|\b(he|she|they|i|we|you) (is|was|are|were|am) (where|what|why|how)\b|\bthe ((only |first |last |remaining |real |open )?(point|question|issue|problem|reason|answer)) (is|was),? (how|why|what|where)\b|\b(is|was|are|were) where (he|she|they|i|we|you) '
example = [
  "The 2025 result is where most lean-file advice comes from.",
  "The instructions file is what makes or breaks future agents in your codebase.",
  "Caching is how we got the latency down.",
  "The handoff is why the deploy failed.",
  "The retry loop is what makes it slow.",
]
acceptable = [
  "Most lean-file advice traces back to the 2025 result.",
  "The instructions file decides whether future agents succeed in your codebase.",
  "We cached the results and got the latency down.",
  "That is why we left.",
  "This is what began it all.",
  "The config file is where you set the port.",
  "Berlin is where she grew up.",
  "The kitchen is where the party ends up.",
  "Line 40 is where the exception is thrown.",
  "The question is whether we ship.",
  "The problem is that it leaks.",
  "The reason is how the parser tokenises hyphens.",
]
